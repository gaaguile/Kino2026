<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="632" viewBox="0 0 1100 632">
    <style>
        text { fill: #f2f3f5; font-family: 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; }
        .title { font-size: 30px; font-weight: 700; letter-spacing: -0.3px; }
        .subtitle { font-size: 15px; fill: #9ba1a9; }
        .panel { font-size: 14px; font-weight: 700; }
        .tick { font-size: 12px; fill: #9ba1a9; }
