<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="How often each number has come up in the Chilean Kino lottery, updated after every draw.">
    <title>Kino number frequency</title>
    <style>
        html { background: #0b0d10; }
        body {
            margin: 0;
            padding: 24px 16px 40px;

            font: 13px/1.5 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif;
        }
        main { max-width: 1100px; margin: 0 auto; }
        /* Narrow screens scroll the chart sideways rather than shrinking its text. */
        .chart { overflow-x: auto; }
        .chart svg { display: block; min-width: 760px; width: 100%; height: auto; }
        .bar:hover { fill: #ffa94d; }
        p { margin: 16px 0 0; padding: 0 4.4%; }
        a { color: #f2f3f5; }
    </style>
</head>
<body>
    <main>
        <div class="chart">
            <!--CHART-->
        </div>
        <p>Updated after every draw (Wednesday, Friday and Sunday). <a href="kino-number-distribution.svg" download>Download the chart</a></p>
